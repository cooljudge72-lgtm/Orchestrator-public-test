# One-time, MANUALLY started check that GitHub's create-reference API is an atomic lock.
# The only place in this repository with contents: write (see docs/LOCK_TEST.md for the risk).
# It runs only when the repository owner starts it on main, and writes/deletes one ref under
# refs/lockcheck/. That path limit is enforced by our Python code, not by GitHub.
name: verify-lock
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: verify-lock
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m lockcheck.verify
