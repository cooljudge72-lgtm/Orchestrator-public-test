# MANUAL, READ-ONLY status report for a pilot task PR. Writes only to the run summary.
# It cannot write to the repository, comment, label, approve or merge.
name: pilot-status
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number of the pilot task
        required: true
        type: string
permissions: {}
jobs:
  status:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python -m lockcheck.pilot_status
